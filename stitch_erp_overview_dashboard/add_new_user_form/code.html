<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add New User Form</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b",
                        "border-light": "#dbdee6",
                        "border-dark": "#334155",
                        "text-main": "#111318",
                        "text-muted": "#616e89",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for webkit to keep it clean */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-main dark:text-gray-100 min-h-screen flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="w-full max-w-[600px] bg-surface-light dark:bg-surface-dark rounded-xl shadow-xl overflow-hidden border border-border-light dark:border-border-dark flex flex-col my-8">
<!-- Header -->
<div class="px-6 py-4 border-b border-border-light dark:border-border-dark flex justify-between items-center bg-white dark:bg-surface-dark">
<h2 class="text-xl font-bold tracking-tight text-text-main dark:text-white">Add New User</h2>
<button class="text-text-muted hover:text-text-main dark:text-gray-400 dark:hover:text-white transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto max-h-[80vh] px-6 py-6 custom-scrollbar">
<!-- Avatar Upload Section -->
<div class="flex flex-col items-center mb-8 gap-4">
<div class="relative group cursor-pointer">
<div class="w-28 h-28 rounded-full bg-gray-200 dark:bg-gray-700 bg-cover bg-center border-4 border-white dark:border-surface-dark shadow-sm overflow-hidden" data-alt="User avatar placeholder with abstract gradient" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA9m-OWBR69AUXdZdYr4dxwfmZYslbzhTK8qqARikneC9gp3_eAMzTTxg0WJ1RRobMTVqVqY-8xxq-jJsteoidBm3YL6RrEhA58bOeBJwwpQh6kZP37Y09JOCIUCoenP7mm7fqrWyk5gBJGijCiKgjG31zvBG5vStT21xuQthaofm86jX99VnCRxMB6F9sW8x6RQe-kQs2lZePKO7i0wopgJBGznuRGNrMUkv5CL3GR6votRB0PiemEhi-JjVApzPiSzeTqhVGAwI-l');">
</div>
<div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white">photo_camera</span>
</div>
<button class="absolute bottom-0 right-0 bg-primary text-white p-2 rounded-full shadow-md border-2 border-white dark:border-surface-dark hover:bg-blue-600 transition-colors flex items-center justify-center h-8 w-8">
<span class="material-symbols-outlined text-[16px]">edit</span>
</button>
</div>
<div class="text-center">
<p class="text-sm font-medium text-primary cursor-pointer hover:underline">Change Profile Photo</p>
<p class="text-xs text-text-muted dark:text-gray-400 mt-1">Allowed *.jpeg, *.jpg, *.png, *.gif</p>
</div>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-5">
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-text-main dark:text-gray-200">Full Name <span class="text-red-500">*</span></label>
<input class="w-full h-12 px-4 rounded-lg border border-border-light dark:border-border-dark bg-white dark:bg-gray-800 text-text-main dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary placeholder-text-muted transition-all" placeholder="Nguyen Van A" type="text"/>
</div>
<!-- Email -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-text-main dark:text-gray-200">Email Address <span class="text-red-500">*</span></label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-text-muted dark:text-gray-500 material-symbols-outlined text-[20px]">mail</span>
<input class="w-full h-12 pl-11 pr-4 rounded-lg border border-border-light dark:border-border-dark bg-white dark:bg-gray-800 text-text-main dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary placeholder-text-muted transition-all" placeholder="example@company.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-text-main dark:text-gray-200">Password <span class="text-red-500">*</span></label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-text-muted dark:text-gray-500 material-symbols-outlined text-[20px]">lock</span>
<input class="w-full h-12 pl-11 pr-11 rounded-lg border border-border-light dark:border-border-dark bg-white dark:bg-gray-800 text-text-main dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary placeholder-text-muted transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-text-muted hover:text-text-main dark:hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Grid Row for Role & Status -->
<div class="grid grid-cols-1 gap-6 pt-2">
<!-- Role Selection -->
<div class="flex flex-col gap-3">
<label class="text-sm font-medium text-text-main dark:text-gray-200">User Role</label>
<div class="grid grid-cols-3 gap-3">
<!-- Admin Option -->
<label class="relative cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="admin"/>
<div class="flex flex-col items-center justify-center p-3 rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-primary transition-all">
<span class="material-symbols-outlined text-[20px] mb-1">shield_person</span>
<span class="text-sm font-medium">Admin</span>
</div>
</label>
<!-- Manager Option -->
<label class="relative cursor-pointer">
<input checked="" class="peer sr-only" name="role" type="radio" value="manager"/>
<div class="flex flex-col items-center justify-center p-3 rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-primary transition-all">
<span class="material-symbols-outlined text-[20px] mb-1">manage_accounts</span>
<span class="text-sm font-medium">Manager</span>
</div>
</label>
<!-- Staff Option -->
<label class="relative cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="staff"/>
<div class="flex flex-col items-center justify-center p-3 rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-primary transition-all">
<span class="material-symbols-outlined text-[20px] mb-1">person</span>
<span class="text-sm font-medium">Staff</span>
</div>
</label>
</div>
</div>
<!-- Active/Inactive Toggle -->
<div class="flex items-center justify-between p-4 rounded-lg border border-border-light dark:border-border-dark bg-background-light dark:bg-gray-800/50">
<div class="flex flex-col">
<span class="text-sm font-medium text-text-main dark:text-gray-200">Account Status</span>
<span class="text-xs text-text-muted dark:text-gray-400">User can login to the system</span>
</div>
<label class="inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/20 dark:peer-focus:ring-primary/30 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
</div>
</form>
</div>
<!-- Footer -->
<div class="px-6 py-4 border-t border-border-light dark:border-border-dark bg-gray-50 dark:bg-gray-900/50 flex justify-end gap-3">
<button class="px-5 py-2.5 rounded-lg border border-border-light dark:border-border-dark text-text-main dark:text-gray-300 font-medium hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-200">
                Hủy
            </button>
<button class="px-5 py-2.5 rounded-lg bg-primary text-white font-medium hover:bg-blue-600 transition-colors shadow-sm shadow-blue-500/30 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                Lưu
            </button>
</div>
</div>
</body></html>
